  # 的修复从 3.5.42 起，而 3.5.42+ 改了 `defineModel` 的重载集合，vben 上游的
  # collapsible / expandable-arrow / preferences/sidebar 四处泛型用法直接类型报错
  # （实测 3.5.42 与 3.5.44 都红）。这个后台是纯客户端 SPA，不走 `renderToString`，
  # server-renderer 的 XSS 路径在本项目不可达；相比之下改上游组件源码会制造升级冲突。
  # 因此保留 3.5.34，把该 advisory 记为「已评估、暂接受」，等 vben 上游修泛型再动。
