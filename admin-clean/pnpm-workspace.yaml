packages:
  - internal/*
  - internal/lint-configs/*
  - packages/*
  - packages/@core/base/*
  - packages/@core/ui-kit/*
  - packages/@core/forward/*
  - packages/@core/*
  - packages/effects/*
  - packages/business/*
  - apps/web-antd
  - scripts/*

publicHoistPattern:
  - lefthook
  - eslint
  - oxfmt
  - oxlint
  - stylelint
  - '*postcss*'
  - '@commitlint/*'
  - czg

strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false

overrides:
  '@ast-grep/napi': 'catalog:'
  '@ctrl/tinycolor': 'catalog:'
  brace-expansion@>=5.0.0 <6.0.0: 5.0.12
  clsx: 'catalog:'
  # 以下各条都是「受影响区间内抬到最近的修复版」，不锁全量版本：
  # 上游自己发新版后这些规则自动失效，不会长期钉住依赖树。
  # 逐个对应的 advisory 见 .harness/journal/2026-10-30-deps-audit-round1.md
  # 与 2026-10-31-deps-gate-policy.md。
  # 1.16.1 只挡住「跨 realm sensitiveHeaders 被共用」那一条；「cross-realm 数组
  # 共享」的绕过要 1.16.2，所以区间上界从 1.16.1 抬到 1.16.2。
  follow-redirects@>=1.16.0 <1.16.2: 1.16.2
  glob@>=10.2.0 <10.5.0: 10.5.0
  # node-forge 装的是 1.4.0，6 条 high 里 5 条写的是 patched >=1.4.1 —— 也就是
  # **有修复版，只是没装**。上一轮把它们记成「上游没有修复版本」是错的：只有
  # GHSA 那条「RSA PKCS#1 v1.5 签名验签」写成 patched <0.0.0（真的没有修复版）。
  # 这里抬到 1.4.2（而非 1.4.1），因为 1.4.1 之后还有一条 X.509 绕过。
  node-forge@>=1.0.0 <1.4.1: 1.4.2
  pinia: 'catalog:'
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # 唯一的 critical：oxfmt 0.51.0 把 tinypool 钉死在 2.1.0，落在
  # 「原型污染 gadget → RCE」（<2.1.2）的受影响区间。2.2.0 与 2.1.x 同大版本，
  # 兼容性以 format:check 输出是否与原状一致为判据，不以「装得上」为准。
  tinypool@<2.1.2: 2.2.0
  undici@>=6.0.0 <6.29.1: 6.29.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  # unplugin-vue@7.2.0 把 vite 当**直接依赖**钉死（不是 peer），于是树里同时存在
  # 8.3.2 与 8.3.5；8.3.0–8.3.2 在 GHSA-c27g-…（vite 中间件绕过）受影响区间内。
  vite@>=8.3.0 <8.3.3: 8.3.5
  vue: 'catalog:'

