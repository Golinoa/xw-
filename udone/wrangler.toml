name = "udone-oms"
main = "apps/api/src/index.ts"
compatibility_date = "2026-10-03"
workers_dev = true

[vars]
APP_VERSION = "development"

[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Workers Logs. Inherited by every named environment above; without it a
# production incident leaves no request-level trace to read.
[observability]
enabled = true

# 租户命令派发。1 分钟是 Cloudflare 的最小粒度，再密没有意义：
# 单条命令的下发超时是 15 秒，租约 5 分钟，一分钟一轮已经够覆盖重试节奏。
# 只有这里触发，**不要**把派发挂进请求链——那等于让运营点一次按钮就下发一次。
[triggers]
crons = ["* * * * *"]
head_sampling_rate = 1

[env.staging]
name = "udone-oms-staging"

[env.staging.vars]
APP_VERSION = "staging"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "udone-oms-production"

[env.production.vars]
APP_VERSION = "production"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
