<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有单 OMS · 图表规范</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#202d37;background:#f0f8fd;--blue:#0077d6;--cyan:#00877e;--line:#e3edf4;--muted:#687887}*{box-sizing:border-box}body{margin:0;padding:44px 24px}.page{max-width:1120px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--blue);font-weight:600}.title{font-size:30px;margin:10px 0 8px;color:#101820}.lead{color:#536370;margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:4px;padding:20px;min-height:280px}.card h2{font-size:16px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}.metric{font-size:24px;font-weight:600;margin:18px 0 10px}.metric small{font-size:12px;color:var(--muted);font-weight:400}.bars{height:145px;display:flex;align-items:end;gap:18px;border-bottom:1px solid #d7e0e8;padding:0 10px 0}.bar{flex:1;min-width:20px;background:linear-gradient(180deg,#33aaff,#0077d6);border-radius:3px 3px 0 0;position:relative}.bar:nth-child(2){background:#00a99d}.bar:nth-child(3){background:#16a34a}.bar:nth-child(4){background:#f08a00}.bar:nth-child(5){background:#8b5cf6}.bar b{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:500;color:#34424d}.bar-labels{display:flex;gap:8px;padding-top:8px}.bar-labels span{flex:1;text-align:center;font-size:11px;color:#536370}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:25px}.donut{width:142px;height:142px;border-radius:50%;background:conic-gradient(#0077d6 0 58%,#00a99d 58% 78%,#16a34a 78% 91%,#eaf0f5 91%);display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:17px;background:#fff;border-radius:50%}.donut-center{z-index:1;text-align:center}.donut-center strong{font-size:25px;display:block}.donut-center small{font-size:11px;color:#687887}.legend{display:grid;gap:10px;font-size:12px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#0077d6}.legend span:nth-child(2) .dot{background:#00a99d}.legend span:nth-child(3) .dot{background:#16a34a}.legend span:nth-child(4) .dot{background:#d7e0e8}.radar{width:100%;height:176px}.radar text{font-family:inherit;font-size:11px;fill:#536370}.radar .axis{stroke:#d7e0e8;stroke-width:1}.radar .shape{fill:#0093ff22;stroke:#0077d6;stroke-width:2}.legend-inline{display:flex;gap:14px;font-size:12px;color:#536370}.legend-inline i{display:inline-block;width:8px;height:8px;background:#0077d6;border-radius:50%;margin-right:5px}.notice{margin-top:16px;border:1px solid #99d5ff;background:#eaf6ff;color:#005eaa;border-radius:4px;padding:13px 16px;font-size:13px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.state{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px;font-size:12px;color:#536370}.empty{height:72px;border:1px dashed #bdc9d4;display:grid;place-items:center;margin-top:10px;color:#687887;border-radius:4px}.error{color:#b42318;background:#fef2f2;border-color:#fecaca}.loading{background:linear-gradient(90deg,#f5f9fc 25%,#eaf0f5 45%,#f5f9fc 65%);background-size:200% 100%}@media(max-width:860px){.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}}@media(max-width:600px){body{padding:28px 14px}.cards{grid-template-columns:1fr}.card:last-child{grid-column:auto}.states{grid-template-columns:1fr}.donut-wrap{gap:16px}}
</style></head><body><main class="page"><div class="eyebrow">DESIGN SYSTEM / DATA VISUALIZATION</div><h1 class="title">图表与数据可视化</h1><p class="lead">先读懂任务状态与项目趋势，再决定图表形式；精确查询保留表格。</p>
