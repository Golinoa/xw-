# ============================================================
# udone 发布流水线（Gitee Go）— 由 tag 触发
#
# 触发条件：推送 udone-v* 形式的 tag，例如 udone-v1.0.0。
#
# 为什么 tag 必须带组件前缀：本仓库是单仓双组件，git tag 在仓库内
# 全局唯一，纯 v1.0.0 无法区分是前端还是运营后台，两个子系统会互相触发。
# 不带前缀的 tag 会被 scripts/release/verify.mjs 直接拒绝。
#
# 为什么这里只配 tags、不配 branches：Gitee Go 的 branches / tags /
# commitMessages 是【交集】关系，同时配置时普通分支推送也可能命中。
# 发布流水线必须只由 tag 触发，日常门禁见 ci.yml。
# ============================================================
version: "1.0"
name: release-udone
displayName: "udone 发布（tag: udone-v*）"

triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - udone-v

stages:
  - stage:
    name: release
    displayName: 校验 → 门禁 → 构建 → 归档
    # 任一步失败立即终止：宁可不发版，也不要产出无法追溯的产物。
    strategy: fast
    trigger: auto
    steps:
      - step: npmbuild@1
        name: release_udone
        displayName: udone 发布
        inputs:
          nodeVersion: "24"
          goals: |
            set -euo pipefail
            node -v
            npm -v
            npm install -g pnpm@11.24.0
            pnpm -v

            # tag 名取自 HEAD 指向的 tag，不依赖平台环境变量：
            # Gitee Go 未公开稳定的 tag 变量名，擅自假设会让发布静默失败。
            TAG=$(git tag --points-at HEAD --list 'udone-v*' | head -n 1)
            if [ -z "$TAG" ]; then
              echo "当前提交上没有 udone-v* 标签，拒绝发布" >&2
              exit 1
            fi
            echo "发布标签：$TAG"

            # 版本一致性闸门：tag 与 .release/manifest.json 不一致就不构建。
            RESOLVED=$(node scripts/release/verify.mjs "$TAG")
            VERSION=$(printf '%s\n' "$RESOLVED" | awk -F= '$1=="version"{print $2}')
            echo "发布版本：$VERSION"

            cd udone
            pnpm install --frozen-lockfile
            pnpm format:check
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm build
            pnpm schema:check
            pnpm check:deploy
            cd ..

            mkdir -p artifacts
            ARCHIVE="artifacts/udone-$VERSION.tar.gz"
            tar -czf "$ARCHIVE" -C udone/apps/web dist
            SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
            printf '%s  %s\n' "$SHA" "$ARCHIVE" > "$ARCHIVE.sha256"

            # 发布元数据：把 tag 与实际产物绑定，事后可反查。
            # Worker 不含独立 bundle（wrangler 部署时现场打包），
            # 因此部署时请从本 tag 检出仓库后执行 wrangler deploy。
            printf '{\n' > "artifacts/udone-$VERSION.json"
            printf '  "component": "udone",\n' >> "artifacts/udone-$VERSION.json"
            printf '  "version": "%s",\n' "$VERSION" >> "artifacts/udone-$VERSION.json"
            printf '  "tag": "%s",\n' "$TAG" >> "artifacts/udone-$VERSION.json"
            printf '  "commit": "%s",\n' "$(git rev-parse HEAD)" >> "artifacts/udone-$VERSION.json"
            printf '  "builtAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "artifacts/udone-$VERSION.json"
            printf '  "archive": "%s",\n' "$ARCHIVE" >> "artifacts/udone-$VERSION.json"
            printf '  "sha256": "%s"\n' "$SHA" >> "artifacts/udone-$VERSION.json"
            printf '}\n' >> "artifacts/udone-$VERSION.json"

            ls -lh artifacts
            cat "artifacts/udone-$VERSION.json"
