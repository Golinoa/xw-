# ============================================================
# udone OMS 日常质量门禁（Gitee Go）
#
# 位置约束：Gitee Go 只读取【仓库根目录】的 .workflow/，放在子目录里
# 等于没有流水线。本文件必须留在仓库根，不可移回 udone/。
#
# 职责边界：本流水线只负责「分支日常门禁」。发布走 tag 触发，
# 见同目录 release-udone.yml / release-admin.yml。三条流水线互不重叠：
# 本文件只配 branches，发布文件只配 tags。Gitee Go 的
# branches / tags / commitMessages 是【交集】关系，同时配置会互相拖累。
#
# 刻意不纳入的门禁及原因：
#   - deps:audit / licenses:check：需要稳定访问 npm registry 与许可证清单。
#   - db:test（pgTAP）：需要本地 PostgreSQL 或 service 容器，Gitee Go 侧尚未验证。
# ============================================================
version: "1.0"
name: udone-ci
displayName: udone 质量门禁

triggers:
  push:
    branches:
      # 只用 prefix 一个类别，别和 precise 混用。
      # Gitee Go 文档：「分支匹配的多种规则是【交集】关系，同时设置只有满足所有规则才触发」。
      # 同一类别内多条是并集，所以 main 与 feat/ 都写进 prefix：main 本身也满足 main 前缀。
      #
      # 这段修复在 620a210 写过一次，后来 42833d0 把 udone/.workflow/ci.yml 移动到仓库根时
      # 覆盖掉了——移动的那份是未修版，于是触发器悄悄退回 precise:[main]，而没人重跑过
      # 「推送后到底触发没有」。10-31 推送 feat/business-slice 时才发现：分支已上远端，
      # 流水线仍然一次都不会跑。移动配置文件时，要按内容核对而不是按路径核对。
      prefix:
        - main
        - feat/
  pr:
    branches:
      precise:
        - main

stages:
  - stage: quality
    displayName: 质量门禁
    # 任一 step 失败立即结束，避免后续步骤在残缺产物上继续跑。
    strategy: fast
    trigger: auto
    steps:
      - step: npmbuild@1
        name: quality_gate
        displayName: 格式/静态检查/类型/测试/构建
        inputs:
          nodeVersion: "24"
          # 版本写死而不用 variables：Gitee Go 对 goals 内的变量展开行为
          # 未经验证，宁可重复一处常量，也不要让门禁依赖不确定的插值。
          # 与 udone/package.json 的 packageManager 保持一致。
          goals: |
            set -euo pipefail
            node -v
            npm -v
            npm install -g pnpm@11.24.0
            pnpm -v

            cd udone
            pnpm install --frozen-lockfile
            pnpm format:check
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm build
            pnpm schema:check
            pnpm check:deploy
